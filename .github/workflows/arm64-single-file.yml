name: ARM64 single file

on:
  workflow_dispatch:
  push:
    branches: [ci/kylin-arm64-single-file]

permissions:
  contents: read

concurrency:
  group: arm64-single-file-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and run standalone ARM64 binary
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record validation environment
        run: |
          mkdir -p evidence dist
          uname -a | tee evidence/uname.txt
          test "$(uname -m)" = aarch64
          cp /etc/os-release evidence/os-release.txt
          git rev-parse HEAD | tee evidence/source-commit.txt
          echo 'This run validates Ubuntu ARM64. Galaxy Kylin compatibility requires a separate target-system run.' >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the existing static release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: thirtyfile:arm64-single-file
          build-args: |
            VERSION=ci-${{ github.sha }}
            CARGO_PROFILE=release
          sbom: false
          provenance: false
      - name: Extract standalone binary and license notices
        shell: bash
        run: |
          set -euo pipefail
          id=$(docker create thirtyfile:arm64-single-file)
          trap 'docker rm "$id" >/dev/null' EXIT
          docker cp "$id:/usr/local/bin/thirtyfile" dist/thirtyfile-linux-arm64
          docker cp "$id:/usr/share/licenses/thirtyfile/LICENSE" dist/LICENSE
          docker cp "$id:/usr/share/licenses/thirtyfile/THIRD-PARTY-NOTICES" dist/THIRD-PARTY-NOTICES
          chmod 755 dist/thirtyfile-linux-arm64
      - name: Verify ELF architecture and static linking
        shell: bash
        run: |
          set -euo pipefail
          file dist/thirtyfile-linux-arm64 | tee evidence/file.txt
          readelf -h dist/thirtyfile-linux-arm64 | tee evidence/elf-header.txt
          readelf -l dist/thirtyfile-linux-arm64 > evidence/elf-program-headers.txt
          readelf -d dist/thirtyfile-linux-arm64 > evidence/elf-dynamic.txt
          grep -Eq 'Machine:.*AArch64' evidence/elf-header.txt
          if grep -q 'INTERP' evidence/elf-program-headers.txt || grep -q '(NEEDED)' evidence/elf-dynamic.txt; then
            echo 'The standalone program requires a dynamic loader or shared libraries.' >&2
            exit 1
          fi
          dist/thirtyfile-linux-arm64 --version | tee evidence/version.txt
          (cd dist && sha256sum thirtyfile-linux-arm64 LICENSE THIRD-PARTY-NOTICES > SHA256SUMS)
          cp scripts/README-arm64-single-file.md dist/README.md
      - name: Run the binary directly on the ARM64 host
        run: python3 scripts/smoke-single-file.py dist/thirtyfile-linux-arm64 --evidence evidence
      - name: Recheck artifact checksums after testing
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Upload tested program
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thirtyfile-linux-arm64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Keep validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arm64-single-file-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
